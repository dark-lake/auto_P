[project]
name = "auto-p"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "beautifulsoup4>=4.14.2",
    "chromadb>=1.3.5",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "mcp==1.23.0",
    "openai>=2.8.1",
    "opencv-python>=4.12.0.88",
    "playwright>=1.56.0",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.1.2",
    "volcengine-python-sdk[ark]>=4.0.41",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "auto_p_services*",
    "auto_p_clients*",
    "auto_p_agents*",
    "auto_p_utils*",
    "auto_p_prompts*",
    "auto_p_exceptions*",
    "auto_p_vector*",
]
exclude = ["logs*", "*.egg-info", ".git*", ".venv*", "__pycache__*"]
