[project]
name = "auto-p"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "beautifulsoup4>=4.14.2",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "mcp>=1.22.0",
    "openai>=2.8.1",
    "opencv-python>=4.12.0.88",
    "playwright>=1.56.0",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["browser_p*", "mcp*", "doc_p*", "utils*"]
exclude = ["logs*", "*.egg-info", ".git*", ".venv*", "__pycache__*"]
